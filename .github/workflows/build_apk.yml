name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependências do Sistema e Cython Compatível
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip cmake libffi-dev libssl-dev zlib1g-dev autoconf libtool pkg-config
          pip install --upgrade pip
          pip install "cython<3.0" buildozer virtualenv

      - name: Compilar APK com Buildozer
        run: |
          yes | buildozer -v android debug

      - name: Publicar APK para Download (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: F1-Telemetry-Dashboard-v1.09-APK
          path: bin/*.apk
          retention-days: 30
